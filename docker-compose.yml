version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: quickbite_db
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quickbite_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: quickbite_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             daphne -b 0.0.0.0 -p 8000 food_delivery_backend.asgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=production-secure-quickbite-secret-key-replace-in-real-env
      - ALLOWED_HOSTS=*
      - DB_ENGINE=postgres
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/food_delivery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    container_name: quickbite_celery
    command: celery -A food_delivery_backend worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=production-secure-quickbite-secret-key-replace-in-real-env
      - DB_ENGINE=postgres
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/food_delivery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

