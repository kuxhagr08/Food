{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In — QuickBite{% endblock %}

{% block extra_css %}
<style>
.auth-page {
  min-height: calc(100dvh - var(--header-height));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem 4rem;
  background: radial-gradient(ellipse at top, rgba(255,59,92,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at bottom-right, rgba(108,71,255,0.06) 0%, transparent 50%);
}
.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.auth-card-header {
  background: var(--grad-hero);
  padding: 2.25rem 2rem 1.75rem;
  text-align: center;
  color: #fff;
}
.auth-card-body { padding: 2rem; }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card animate-scale-in">

    <!-- Header -->
    <div class="auth-card-header">
      <div style="font-size:2.5rem;margin-bottom:0.5rem;">👋</div>
      <h1 style="font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:0.3rem;">Welcome back!</h1>
      <p style="color:rgba(255,255,255,0.65);font-size:0.9rem;margin:0;">Sign in to your QuickBite account</p>
    </div>

    <div class="auth-card-body">
      <!-- Login Form -->
      <form method="POST" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
          <label class="form-label">Email or Username</label>
          <input type="text" name="username" id="emailInput" class="form-input"
                 placeholder="name@example.com or username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" id="passwordInput" class="form-input"
                 placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;font-size:1rem;">
          Sign In →
        </button>
      </form>

      <div style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted);">
        Don't have an account?
        <a href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}" style="color:var(--brand-1);font-weight:700;">Sign up free</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
